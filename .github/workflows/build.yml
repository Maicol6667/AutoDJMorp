name: Build AutoDJMorp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AutoDJMorp integration
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Prepare permanent AutoDJMorp signing key
        env:
          AUTODJ_SIGNING_CONFIG: ${{ secrets.AUTODJ_SIGNING_CONFIG }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          config = json.loads(os.environ["AUTODJ_SIGNING_CONFIG"])
          with open("app/release-key.jks", "wb") as key:
              key.write(base64.b64decode(config["keystore_base64"], validate=True))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("AUTODJ_STORE_PASSWORD=" + config["store_password"] + "\n")
              env.write("AUTODJ_KEY_ALIAS=" + config["key_alias"] + "\n")
              env.write("AUTODJ_KEY_PASSWORD=" + config["store_password"] + "\n")
          PY

      - name: Build integrated YouTube Music player and crossfade
        run: bash scripts/build-muzza.sh

      - name: Upload signed AutoDJMorp APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoDJMorp-APK
          path: build-source/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
