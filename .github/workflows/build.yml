name: Build AutoDJMorp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing key
        env:
          AUTODJ_SIGNING_CONFIG: ${{ secrets.AUTODJ_SIGNING_CONFIG }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          config = json.loads(os.environ["AUTODJ_SIGNING_CONFIG"])
          with open("app/release-key.jks", "wb") as key:
              key.write(base64.b64decode(config["keystore_base64"]))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("AUTODJ_STORE_PASSWORD=" + config["store_password"] + "\\n")
              env.write("AUTODJ_KEY_ALIAS=" + config["key_alias"] + "\\n")
              env.write("AUTODJ_KEY_PASSWORD=" + config["key_password"] + "\\n")
          PY

      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("Manifest XML is valid")
          PY

      - name: Build signed APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoDJMorp-APK
          path: app/build/outputs/apk/release/*.apk
